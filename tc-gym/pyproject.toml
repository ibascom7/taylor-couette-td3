[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tc_gym"
version = "0.1.0"
description = "Gymnasium environment for Taylor-Couette mixing driven by OpenFOAM (pimpleFoam)."
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.3",
    "torch",
    "matplotlib",
    "tensorboard",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tc_gym"]
